<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Concierge</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #1C1C18; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      box-sizing: border-box;
      font-family: 'DM Sans', system-ui, sans-serif;
    }
    @keyframes cc-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cc-slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes cc-fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    *::-webkit-scrollbar { display: none; }
    button { -webkit-tap-highlight-color: transparent; font-family: inherit; }
    input, textarea { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" src="item-detail.jsx"></script>
  <script type="text/babel" src="new-flows.jsx"></script>
  <script type="text/babel" src="signin.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "rosette",
      "density": "comfortable",
      "gridCols": 2,
      "showFrame": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [signedIn, setSignedIn] = useState(false);
      const [clients, setClients] = useState(SEED_CLIENTS);
      const [view, setView] = useState({ kind: 'list' });
      const [flow, setFlow] = useState(null); // 'newClient' | 'addItem' | null

      const updateItem = (clientId, itemId, patch) => {
        setClients(cs => cs.map(c => {
          if (c.id !== clientId) return c;
          const items = c.items.map(it => it.id === itemId ? { ...it, ...patch } : it);
          return { ...c, items, status: rolledStatus(items) };
        }));
      };

      const createClient = (newClient) => {
        setClients(cs => [newClient, ...cs]);
        setFlow(null);
        setView({ kind: 'client', clientId: newClient.id });
      };

      const createItem = (clientId, newItem) => {
        setClients(cs => cs.map(c => {
          if (c.id !== clientId) return c;
          const items = [...c.items, newItem];
          return { ...c, items, status: rolledStatus(items) };
        }));
        setFlow(null);
      };

      const accentVar = tweaks.accent === 'tangerine' ? 'var(--endless-tangerine)' :
                         tweaks.accent === 'noir' ? 'var(--endless-noir)' :
                         'var(--endless-rosette)';

      const accentStyle = (
        <style dangerouslySetInnerHTML={{ __html: `
          [data-app-root] { --accent: ${accentVar}; --accent-soft: ${tweaks.accent === 'tangerine' ? 'var(--endless-tangerine-50)' : tweaks.accent === 'noir' ? 'var(--endless-linen-100)' : 'var(--endless-rosette-50)'}; }
        ` }} />
      );

      const currentClient = view.clientId ? clients.find(c => c.id === view.clientId) : null;
      const currentItem = currentClient && view.itemId ? currentClient.items.find(i => i.id === view.itemId) : null;

      const screen = (
        <div data-app-root style={{ width: '100%', height: '100%', position: 'relative', background: 'var(--endless-linen-50)', overflow: 'hidden' }}>
          {accentStyle}
          {!signedIn ? (
            <SignInScreen onEnter={() => setSignedIn(true)} />
          ) : (
          <>
          <div style={{ position: 'absolute', inset: 0 }}>
            {view.kind === 'list' && (
              <div style={{ position: 'absolute', inset: 0, overflow: 'auto' }}>
                <ClientList clients={clients} onOpen={(id) => setView({ kind: 'client', clientId: id })} onNew={() => setFlow('newClient')} accent={accentVar} />
              </div>
            )}
            {(view.kind === 'client' || view.kind === 'item') && currentClient && (
              <ClientDetail
                client={currentClient}
                onBack={() => setView({ kind: 'list' })}
                onOpenItem={(cid, iid) => setView({ kind: 'item', clientId: cid, itemId: iid })}
                onItemAction={updateItem}
                onAddItem={() => setFlow('addItem')}
                accent={accentVar}
              />
            )}
          </div>
          {view.kind === 'item' && currentItem && (
            <ItemDetail
              item={currentItem} client={currentClient}
              onClose={() => setView({ kind: 'client', clientId: currentClient.id })}
              onAction={updateItem}
              accent={accentVar}
            />
          )}
          {flow === 'newClient' && (
            <NewClientFlow onClose={() => setFlow(null)} onCreate={createClient} />
          )}
          {flow === 'addItem' && currentClient && (
            <AddItemFlow client={currentClient} onClose={() => setFlow(null)} onCreate={(item) => createItem(currentClient.id, item)} />
          )}
          </>
          )}
        </div>
      );

      return (
        <>
          {tweaks.showFrame ? (
            <IOSDevice width={402} height={874}>{screen}</IOSDevice>
          ) : (
            <div style={{ width: 402, height: 874, borderRadius: 24, overflow: 'hidden', position: 'relative', background: '#fff', boxShadow: '0 40px 80px rgba(0,0,0,0.18)' }}>
              {screen}
            </div>
          )}

          <TweaksPanel title="Tweaks">
            <TweakSection title="Accent">
              <TweakRadio
                value={tweaks.accent}
                onChange={v => setTweak('accent', v)}
                options={[
                  { value: 'rosette', label: 'Rosette' },
                  { value: 'tangerine', label: 'Tangerine' },
                  { value: 'noir', label: 'Noir' },
                ]}
              />
            </TweakSection>
            <TweakSection title="Frame">
              <TweakToggle value={tweaks.showFrame} onChange={v => setTweak('showFrame', v)} label="iOS device frame" />
            </TweakSection>
            <TweakSection title="Auth">
              <TweakToggle value={signedIn} onChange={setSignedIn} label="Signed in" />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
